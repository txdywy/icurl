[package]
name = "icurl"
version = "0.1.0"
edition = "2021"
description = "A network diagnostic curl-like tool written in Rust"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["rustls-tls", "http2", "http3"], default-features = false }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
url = "2"
webpki-roots = "0.26"
ipnet = "2"
